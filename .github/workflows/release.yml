# Every push to main: tests, the app's type check and Zengin check, then semantic-release decides from the
# commit messages whether there is a release, and if so bumps package.json, writes CHANGELOG.md, tags, and
# publishes GitHub release notes. A release also goes to ghcr.io as the container image (Dockerfile, deploy/docker).
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm ci --ignore-scripts
        working-directory: app
      # The app: the real build (tokens, type check, bundle), then the design-system rules. A fresh clone has no
      # generated tokens until the build makes them, so running tsc alone would pass while vite build failed.
      - run: npm run build
        working-directory: app
      - run: npx zengin check
        working-directory: app
      # One browser run of the built app on a copy of the sample vault (app/e2e).
      - run: npx playwright install --with-deps chromium
        working-directory: app
      - run: npm run test:e2e
        working-directory: app
      # The site: types and the design-system rules. Vercel does the build.
      - run: npm ci --ignore-scripts
        working-directory: site
      - run: npx zengin tokens && npx tsc --noEmit -p .
        working-directory: site
      - run: npx zengin check
        working-directory: site

  # The container image (Dockerfile, deploy/docker): it builds, starts on an empty profile folder, takes the sample,
  # answers on loopback, and refuses a forwarded request without an allowed Tailscale login.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tekjobs:ci .
      - name: Smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/vault" && chmod 777 "$RUNNER_TEMP/vault"
          docker run -d --name tj -v "$RUNNER_TEMP/vault:/vault" tekjobs:ci
          sleep 5
          docker exec tj tekjobs init --sample /vault
          docker exec tj node -e "fetch('http://127.0.0.1:8787/api/summary').then(r=>{if(!r.ok)process.exit(1)})"
          docker exec tj node -e "fetch('http://127.0.0.1:8787/api/summary',{headers:{'x-forwarded-for':'100.64.0.2'}}).then(r=>{if(r.status!==403)process.exit(1)})"
          docker logs tj
          docker rm -f tj

  release:
    needs: [check, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write   # npm Trusted Publishing: the job proves its identity to npm over OIDC
      packages: write   # the container image on ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships an older one.
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts
      # The package ships the built UI (app/dist), so the release job builds it before publishing.
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
      # A release tags HEAD; when it did, the same version goes to ghcr.io as a container image, for both
      # amd64 and arm64 (a NAS or a Raspberry Pi), tagged with the version and latest.
      - id: tag
        run: echo "version=$(git tag --points-at HEAD | sed -n 's/^v//p' | head -1)" >> "$GITHUB_OUTPUT"
      - if: steps.tag.outputs.version
        uses: docker/setup-qemu-action@v3
      - if: steps.tag.outputs.version
        uses: docker/setup-buildx-action@v3
      - if: steps.tag.outputs.version
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.tag.outputs.version
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/timurtek/tekjobs:${{ steps.tag.outputs.version }}
            ghcr.io/timurtek/tekjobs:latest
          labels: |
            org.opencontainers.image.source=https://github.com/Timurtek/tekjobs
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.licenses=MIT
