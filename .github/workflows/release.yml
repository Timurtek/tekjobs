# Every push to main: tests, the app's type check and Zengin check, then semantic-release decides from the
# commit messages whether there is a release, and if so bumps package.json, writes CHANGELOG.md, tags, and
# publishes GitHub release notes. Nothing goes to npm.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            site/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm ci --ignore-scripts
        working-directory: app
      # The app: the real build (tokens, type check, bundle), then the design-system rules. A fresh clone has no
      # generated tokens until the build makes them, so running tsc alone would pass while vite build failed.
      - run: npm run build
        working-directory: app
      - run: npx zengin check
        working-directory: app
      # The site: types and the design-system rules. Vercel does the build.
      - run: npm ci --ignore-scripts
        working-directory: site
      - run: npx zengin tokens && npx tsc --noEmit -p .
        working-directory: site
      - run: npx zengin check
        working-directory: site

  release:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # The package ships the built UI (app/dist), so the release job builds it before publishing.
      - run: npm ci --ignore-scripts
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
