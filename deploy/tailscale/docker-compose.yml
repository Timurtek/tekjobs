# Tailscale sidecar: gives TekJobs its own tailnet name, https://tekjobs.<your-tailnet>.ts.net
#
# It does NOT run TekJobs. TekJobs stays native on the machine (127.0.0.1:8787) because cover letters, tailored
# resumes and the mail and calendar checks run the host's signed-in CLI (claude by default), the profile folder is a
# path on the host, and the scan runs the host's Node. This container only joins the tailnet as "tekjobs" and proxies
# to the native server (see serve.json). Tailnet only: Funnel is off, so nothing here is on the public internet.
#
# Before the first `up`, the server must know who may come in through the proxy, or it refuses everyone:
#   TEKJOBS_ALLOWED_LOGINS=you@example.com  in the server's environment, or
#   "allowedLogins": ["you@example.com"]     in ~/.tekjobs/config.json
#
#   1. Tailscale admin console → Settings → Keys → Generate auth key (reusable: off, ephemeral: off).
#      Copy .env.example to .env (it is gitignored) and put the key there as TS_AUTHKEY.
#   2. docker compose up -d
#   3. Open https://tekjobs.<your-tailnet>.ts.net (the first load takes a few seconds for the certificate).
#
# The key is only needed for the first login; the node's state is kept in the named volume.
#
# The project is named so it does not share the default (the folder name, "tailscale") with another sidecar kept in a
# folder of the same name: two projects of one name share a network and see each other's containers as orphans.
name: tekjobs-tailscale
services:
  tekjobs-tailscale:
    image: tailscale/tailscale:v1.102.2
    container_name: tekjobs-tailscale
    hostname: tekjobs
    restart: always
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_HOSTNAME: tekjobs
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Docker Desktop on Windows has no /dev/net/tun for containers; userspace mode needs none.
      TS_USERSPACE: "true"
    volumes:
      - tekjobs-tailscale-state:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  tekjobs-tailscale-state:
