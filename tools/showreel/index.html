<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TekJobs Showreel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=Azeret+Mono:wght@400;500;600&display=block">
<style>
/* The TekJobs brand, dark: forest surfaces, one lime accent, hairlines instead of shadows.
   One timeline, three frames: 1920x1080 by default, 1080x1920 with ?format=vertical (the .v rules),
   1080x1080 with ?format=square (.v, then the .v.sq rules). */
:root{
  --bg0:#08120c;--bg:#0d1a14;--bg1:#122119;--bg2:#1a3326;--bg3:#224030;
  --text:#e9f5ee;--muted:#a9c2b4;--subtle:#8aa596;--faint:#6c8878;
  --line:#1c2e25;--line2:#274536;--line3:#35594a;
  --lime:#c8f542;--ok:#7fd9a2;--bad:#ef8f8f;
  --display:"Bricolage Grotesque","Hanken Grotesk",sans-serif;
  --sans:"Hanken Grotesk",Helvetica,Arial,sans-serif;
  --mono:"Azeret Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:var(--bg0)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg0);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#stage.v{width:1080px;height:1920px}
#stage.v.sq{height:1080px}
canvas{position:absolute;left:0;top:0}
.scene{position:absolute;inset:0;display:none;transform-origin:50% 50%}
.abs{position:absolute}
.lime{color:var(--lime)}
.mono{font-family:var(--mono)}
.eyebrow{position:absolute;font-family:var(--mono);font-size:21px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--lime);white-space:nowrap}
.h1{position:absolute;font-family:var(--display);font-weight:600;line-height:1;letter-spacing:-.018em;white-space:nowrap}
.h1 .line{display:block}
.h1 .w{display:inline-block;overflow:hidden;vertical-align:top;margin-right:.23em;padding-bottom:.12em;margin-bottom:-.12em}
.h1 .wi{display:inline-block}
.panel{position:absolute;background:var(--bg);border:1px solid var(--line2);border-radius:8px}
.full{position:absolute;left:0;width:100%;text-align:center}

/* HUD */
#lockup{position:absolute;left:120px;top:40px;display:flex;align-items:center;gap:14px;font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.02em}
#lockup img{width:48px;height:48px}
#tagTop{position:absolute;right:120px;top:54px;font-family:var(--mono);font-size:18px;letter-spacing:.2em;color:var(--faint)}
#progress{position:absolute;left:0;bottom:0;height:4px;background:var(--lime)}
#flash{position:absolute;inset:0;background:var(--lime);opacity:0;pointer-events:none}
#wipe{position:absolute;top:0;height:100%;width:3px;background:var(--lime)}
#wipeBand{position:absolute;top:0;height:100%;width:160px;background:var(--lime);opacity:.07}
.v #lockup{left:80px;top:110px;font-size:34px}
.v #lockup img{width:56px;height:56px}
.v #tagTop{right:80px;top:128px;font-size:16px}

/* S0 */
#clock{top:380px;font-family:var(--mono);font-weight:500;font-size:230px;letter-spacing:-.04em;line-height:1}
#clockEyebrow{left:0;width:100%;text-align:center;top:320px}
#cmd0{top:680px;font-family:var(--mono);font-size:36px;color:var(--text)}
#cmd0 .c{color:var(--faint)}
.v #clock{top:760px;font-size:152px}
.v #clockEyebrow{top:700px}
.v #cmd0{top:990px;font-size:30px;line-height:1.6}
.caret{display:inline-block;width:.55em;height:1.05em;background:var(--lime);vertical-align:-.15em;margin-left:.08em}

/* S1 */
.chiprow{position:absolute;left:0;display:flex;gap:18px;white-space:nowrap}
.chip{display:flex;align-items:center;gap:14px;height:66px;padding:0 26px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);font-family:var(--mono);font-size:24px;color:var(--faint)}
.chip .dot{width:11px;height:11px;border-radius:50%;background:var(--line3)}
.chip.done{color:var(--text);border-color:var(--line3)}
.chip.done .dot{background:var(--lime)}
.stats{position:absolute}
.v .stats{display:flex;gap:90px}
.stat .n{font-family:var(--mono);font-weight:500;font-size:72px;letter-spacing:-.04em;line-height:1}
.stat .l{font-family:var(--mono);font-size:20px;color:var(--subtle);margin-top:10px;letter-spacing:.04em}

/* S2 */
#s2num{top:130px;font-family:var(--mono);font-weight:500;font-size:170px;letter-spacing:-.05em;line-height:1}
.s2lab{top:330px;font-family:var(--mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase}
.v #s2num{top:340px}
.v .s2lab{top:545px;font-size:22px}
.mini{position:absolute;width:220px;height:100px;padding:14px 16px;border:1px solid var(--line2);border-radius:6px;background:var(--bg);transform-origin:50% 50%}
.v .mini{width:300px}
.mini .sc{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--lime);line-height:1}
.mini .co{font-size:17px;font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ti{font-size:14px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini.low .sc{color:var(--subtle)}

/* S3 */
#jobcard{left:120px;top:320px;width:1060px;height:660px;padding:40px 44px}
.v #jobcard{left:80px;top:985px;width:920px;height:auto;padding:30px 36px 18px}
.srcchip{display:inline-flex;align-items:center;height:36px;padding:0 14px;border:1px solid var(--line2);border-radius:4px;font-family:var(--mono);font-size:18px;color:var(--subtle);margin-right:10px}
#jobcard .jt{font-family:var(--display);font-weight:600;font-size:48px;letter-spacing:-.025em;margin-top:24px;line-height:1.05}
#jobcard .jm{font-size:23px;color:var(--muted);margin-top:14px}
#jobcard .hr{height:1px;background:var(--line2);margin:30px 0 22px}

/* S4 */
#todayPanel{left:900px;top:140px;width:900px;height:840px;padding:28px 34px}
.v #todayPanel{left:80px;top:700px;width:920px;height:830px}
.phead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:19px;letter-spacing:.18em;color:var(--subtle);padding-bottom:18px;border-bottom:1px solid var(--line2)}
.trow{position:absolute;left:34px;width:830px;height:112px;display:flex;align-items:center;gap:26px;border-bottom:1px solid var(--line)}

.trow .t1{font-size:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.trow .sal{font-family:var(--mono);font-size:21px;color:var(--muted);flex:none}

.v .trow .sal{font-size:19px}
.trow .st{position:absolute;right:0;top:34px;height:42px;padding:0 16px;border-radius:4px;font-family:var(--mono);font-size:18px;letter-spacing:.08em;display:flex;align-items:center;background:var(--bg0)}
.trow .st.rev{border:1px solid var(--lime);color:var(--lime)}

#hl{position:absolute;left:0;width:100%;height:112px;background:var(--bg2);border-left:4px solid var(--lime)}
#todaySub{position:absolute;left:120px;top:600px;width:700px;font-size:30px;line-height:1.4;color:var(--muted)}
.v #todaySub{left:80px;top:560px;width:920px;font-size:28px}

/* S5 */
.col{position:absolute;top:300px;width:320px;height:680px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.v .col{left:70px;width:940px;height:180px}
.col .ch{display:flex;justify-content:space-between;padding:20px 18px 0;font-family:var(--mono);font-size:17px;letter-spacing:.16em;color:var(--subtle)}
.v .col .ch{padding:15px 18px 0}
.col .ch b{font-weight:500;color:var(--text)}
.kcard{position:absolute;left:0;top:0;width:292px;height:110px;padding:16px 18px;border:1px solid var(--line2);border-radius:6px;background:var(--bg1);transform-origin:50% 50%}
.kcard .kc{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .kt{font-size:17px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.kcard .kb{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--mono);font-size:16px;color:var(--faint)}
.kcard .ks{padding:3px 8px;border-radius:3px;background:var(--bg2);color:var(--lime);font-weight:500}
#cursor{position:absolute;left:0;top:0;width:40px;height:40px;z-index:10}
.bit{position:absolute;width:12px;height:12px;background:var(--lime)}

/* S6 */
#term{left:120px;top:300px;width:900px;height:620px;overflow:hidden}
.v #term{left:80px;top:560px;width:920px;height:585px}
.tbar{height:50px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px;padding:0 20px;font-family:var(--mono);font-size:17px;color:var(--faint)}
.tbar i{width:13px;height:13px;border-radius:50%;border:1px solid var(--line3);display:inline-block}
.tbar span{margin-left:14px}
.tbody{padding:26px 32px;font-family:var(--mono);font-size:23px;line-height:44px;white-space:pre}
.v .tbody{padding:22px 30px;font-size:22px;line-height:42px}
#tools{left:1080px;top:300px;width:720px;height:620px;padding:22px 26px}
.v #tools{left:80px;top:1165px;width:920px;height:330px}
.tool{position:absolute;height:24px;padding:0 8px;line-height:24px;font-family:var(--mono);font-size:16px;color:var(--muted);border-radius:3px;white-space:nowrap}
.v .tool{font-size:13px;height:21px;line-height:21px;padding:0 6px}
#clients{position:absolute;left:120px;top:950px;display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:20px;color:var(--subtle)}
.v #clients{left:80px;top:1520px;gap:12px;font-size:17px}
.cchip{height:48px;padding:0 20px;border:1px solid var(--line2);border-radius:4px;display:flex;align-items:center;color:var(--text);font-family:var(--sans);font-weight:600;font-size:21px;background:var(--bg)}
.v .cchip{padding:0 16px;font-size:20px}

/* S7 */
#form{left:510px;top:120px;width:900px;height:470px;padding:34px 40px}
.v #form{left:80px;top:300px;width:920px}
.frow{display:flex;align-items:center;justify-content:space-between;height:68px;border-bottom:1px solid var(--line);font-size:23px}
.frow .fl{font-family:var(--mono);font-size:18px;letter-spacing:.12em;color:var(--subtle);width:230px}
.frow .fv{flex:1;color:var(--text)}
.frow .ck{font-family:var(--mono);color:var(--ok);font-size:22px}
#submit{position:absolute;left:1030px;top:490px;width:340px;height:68px;border:1px solid var(--line3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:24px;background:var(--bg1)}
#submitRing{position:absolute;left:1018px;top:478px;width:364px;height:92px;border:2px dashed var(--lime);border-radius:10px}
#yours{position:absolute;left:1030px;top:600px;width:340px;text-align:center;font-family:var(--mono);font-size:18px;letter-spacing:.16em;color:var(--lime)}
.v #submit{left:620px;top:670px}
.v #submitRing{left:608px;top:658px}
.v #yours{left:620px;top:790px}
#agent{position:absolute;left:0;top:0}
#agent .tag{position:absolute;left:34px;top:34px;padding:4px 10px;background:var(--lime);color:var(--bg0);font-family:var(--mono);font-size:16px;font-weight:600;border-radius:3px;white-space:nowrap}
#s7sub{top:850px;font-size:40px;color:var(--muted)}
.v #s7sub{top:1200px}
#tree{left:1020px;top:170px;width:780px;height:740px;padding:34px 40px;font-family:var(--mono);font-size:25px;line-height:47px;white-space:pre}
.v #tree{left:80px;top:610px;width:920px;height:720px}
.tl{position:absolute;left:40px}
.tl .g{color:var(--line3)}
.tl .dir{color:var(--text);font-weight:500}

.tl .ext{color:var(--lime)}
#s7bsub{position:absolute;left:120px;top:640px;font-family:var(--mono);font-size:24px;line-height:1.8;color:var(--subtle)}
.v #s7bsub{left:80px;top:1370px}
#s7bsub b{color:var(--text);font-weight:500}

/* S8 */
#endAvatar{position:absolute;left:840px;top:90px;width:240px;height:240px}
.v #endAvatar{left:410px;top:380px;width:260px;height:260px}
#endRing{position:absolute;border:2px solid var(--lime);border-radius:50%}
#word{top:365px;font-family:var(--display);font-weight:600;font-size:176px;letter-spacing:.01em;line-height:1}
.v #word{top:690px;font-size:180px}
#word .lw{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.06em}
#word .li{display:inline-block}
#endTag .line{display:block}
#endCmd{position:absolute;left:560px;top:735px;width:800px;height:84px;border:1px solid var(--line3);border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:32px}

.v #endUrl{top:1290px;font-size:22px}
#endUrl b{color:var(--text);font-weight:500}

.clean #lockup,.clean #tagTop,.clean #progress,.clean #wipe,.clean #wipeBand,.clean #flash{display:none}
.clean .eyebrow{visibility:hidden}

/* Square: the stacked layout, made to fit 1080x1080 */
.v.sq #lockup{left:60px;top:40px;font-size:28px}
.v.sq #lockup img{width:44px;height:44px}

<body>
<div id="stage">
  <canvas id="bg"></canvas>

  <div class="scene" id="s0">
    <div class="eyebrow" id="clockEyebrow">Every morning</div>
    <div id="clock" class="full">07:29:57</div>
    <div id="cmd0" class="full"></div>
  </div>

  <div class="scene" id="s1"></div>
  <div class="scene" id="s2"><canvas id="pc"></canvas></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4"></div>
  <div class="scene" id="s5"></div>
  <div class="scene" id="s6"></div>
  <div class="scene" id="s7a"></div>
  <div class="scene" id="s7b"></div>
  <div class="scene" id="s8"></div>

  <div id="lockup"><img src="../../site/public/brand/tekjobs-avatar-512.png" alt=""><span>TEK<span class="lime">JOBS</span></span></div>
  <div id="tagTop">LOCAL-FIRST JOB SEARCH</div>
  <div id="wipeBand"></div><div id="wipe"></div>
  <div id="flash"></div>
  <div id="progress"></div>
</div>

<script>
const DURATION = 45;
const q = new URLSearchParams(location.search);
const FORMAT = ['vertical', 'square'].includes(q.get('format')) ? q.get('format') : 'landscape';
const SQ = FORMAT === 'square';
const VERT = FORMAT !== 'landscape'; // the stacked layouts: vertical, and square, which is vertical made shorter
const [W, H] = { landscape: [1920, 1080], vertical: [1080, 1920], square: [1080, 1080] }[FORMAT];
/** V(vertical, landscape, square = vertical): the one switch between the frames */

function env(scene, t, a, b, o = {}) {
  if (t < a || t >= b) { scene.style.display = 'none'; return false; }
  scene.style.display = 'block';
  const pi = o.noIn ? 1 : P(t, a, a + (o.inDur || .45), E.outCubic);
  const po = o.noOut ? 0 : P(t, b - (o.outDur || .35), b, E.inCubic);
  const kb = 1 + .014 * ((t - a) / (b - a));
  scene.style.transform = `scale(${lerp(.965, 1, pi) * kb * lerp(1, 1.08, po)})`;
  scene.style.opacity = Math.min(pi, 1 - po);

}

const bg = $('#bg').getContext('2d');
function drawBg(t) {
  bg.fillStyle = '#08120c'; bg.fillRect(0, 0, W, H);
  const cell = 96, ox = (t * 7) % cell, oy = (t * 4) % cell;
  // lit cells, a new handful every beat
  const beat = Math.floor(t * 2), R = rng(beat * 97 + 11), fade = 1 - (t * 2 - beat);
  for (let i = 0; i < 7; i++) {
    const cx = Math.floor(R() * Math.ceil(W / cell + 1)) * cell - ox, cy = Math.floor(R() * Math.ceil(H / cell + 1)) * cell - oy;
    bg.fillStyle = `rgba(18,33,25,${.9 * fade})`; bg.fillRect(cx + 1, cy + 1, cell - 1, cell - 1);
  }
  bg.strokeStyle = 'rgba(28,46,37,.7)'; bg.lineWidth = 1; bg.beginPath();
  for (let x = -ox; x < W + cell; x += cell) { bg.moveTo(Math.round(x) + .5, 0); bg.lineTo(Math.round(x) + .5, H); }
  for (let y = -oy; y < H + cell; y += cell) { bg.moveTo(0, Math.round(y) + .5); bg.lineTo(W, Math.round(y) + .5); }
  bg.stroke();
  bg.fillStyle = 'rgba(53,89,74,.8)';
  for (let x = -ox; x < W + cell; x += cell) for (let y = -oy; y < H + cell; y += cell) { bg.fillRect(Math.round(x) - 3, Math.round(y), 7, 1); bg.fillRect(Math.round(x), Math.round(y) - 3, 1, 7); }
  // edges fall to the deepest surface so the grid reads as a floor, not wallpaper
  const g = bg.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, Math.max(W, H) * .6);
  g.addColorStop(0, 'rgba(8,18,12,0)'); g.addColorStop(1, 'rgba(8,18,12,.92)');
  bg.fillStyle = g; bg.fillRect(0, 0, W, H);
}

  const [rcx, rcy] = V([540, 510], [960, 210], [540, 210]);
  [[S.endRing, 40.5], [S.endRing2, 40.7]].forEach(([r, a0]) => {
    const p = P(t, a0, a0 + 1.1, E.outCubic); const d = lerp(240, 1500, p);
    r.style.left = (rcx - d / 2) + 'px'; r.style.top = (rcy - d / 2) + 'px'; r.style.width = r.style.height = d + 'px';
    r.style.opacity = t < a0 ? 0 : (1 - p) * .8;
  });
  S.letters.forEach((l, i) => { const p = P(t, 40.62 + i * .045, 41.2 + i * .045, E.outExpo); l.style.transform = `translateY(${(1 - p) * 110}%)`; });
  reveal(S.endTag, t, 41.3, .05, .6);
  const ca = P(t, 41.95, 42.35, E.outExpo);
  const blink = Math.floor(t * 2.5) % 2 === 0 ? '<span class="caret"></span>' : '<span class="caret" style="opacity:0"></span>';
  S.endCmd.innerHTML = `<span class="lime">$</span>&nbsp;${esc(typed('npx @timurtekb/tekjobs init', t, 42.1, 40))}${blink}`;
  tf(S.endCmd, { y: (1 - ca) * 30, o: ca });
  tf(S.endUrl, { o: P(t, 42.9, 43.3), y: (1 - P(t, 42.9, 43.4, E.outExpo)) * 14 });
}

/* ---------- HUD ---------- */
const CUTS = [4, 9, 12.5, 19, 24, 30, 36.5, 38.5, 40.5];
function hud(t) {
  const lk = P(t, 4.1, 4.5) * (1 - P(t, 40.2, 40.5));
  tf($('#lockup'), { o: lk, y: (1 - P(t, 4.1, 4.6, E.outExpo)) * -20 });
  tf($('#tagTop'), { o: lk });
  $('#progress').style.width = (t / DURATION * W) + 'px';
  // a lime scan line crosses the frame on every cut
  let wx = -400;
  CUTS.forEach(c => { const p = (t - (c - .28)) / .46; if (p > 0 && p < 1) wx = lerp(-60, W + 80, E.inOutCubic(p)); });
  tf($('#wipe'), { x: wx }); tf($('#wipeBand'), { x: wx - 160 });
  let fl = 0;
  [[2, .22, .35], [16.15, .06, .3], [28.4, .08, .3], [40.5, .4, .6]].forEach(([a, k, d]) => { if (t >= a) fl = Math.max(fl, k * (1 - P(t, a, a + d, E.lin))); });
  $('#flash').style.opacity = fl;
}

function render(t) {
  drawBg(t);
  s0(t); s1(t); s2(t); s3(t); s4(t); s5(t); s6(t); s7a(t); s7b(t); s8(t);
  hud(t);
}
window.render = render;

window.ready = (async () => {
  await Promise.all([
    document.fonts.load('600 100px "Bricolage Grotesque"'),
    document.fonts.load('400 20px "Hanken Grotesk"'), document.fonts.load('600 20px "Hanken Grotesk"'),
    document.fonts.load('400 20px "Azeret Mono"'), document.fonts.load('500 20px "Azeret Mono"'), document.fonts.load('600 20px "Azeret Mono"'),
  ]);
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => i.onload = r)));
  build();
  render(0);
  return true;
})();

// open the file directly and it plays in real time; ?t=12.3 freezes a frame; ?format=vertical for 9:16, ?format=square for 1:1
window.ready.then(() => {
  if (q.has('t')) { render(+q.get('t')); return; }
  if (q.has('render')) return;
  const t0 = performance.now();
  const loop = () => { render(((performance.now() - t0) / 1000) % DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
});
</script>
